apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: noteops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Med-Aziz-Daira/noteops
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: noteops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
