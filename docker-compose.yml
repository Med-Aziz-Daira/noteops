
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: noteops
      POSTGRES_USER: noteops
      POSTGRES_PASSWORD: noteops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://noteops:noteops@postgres:5432/noteops
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost/api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
