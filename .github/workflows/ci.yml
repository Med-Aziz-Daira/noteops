name: CI Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt --severity critical

      - name: Run Bandit SAST scan
        working-directory: backend
        run: |
          bandit -r app/ -ll -ii --exit-zero \
            --format json -o bandit-report.json
          bandit -r app/ -ll -ii

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: [secret-scanning, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with flake8
        working-directory: backend
        run: flake8 app/ run.py --max-line-length=100 --exclude=venv

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies and generate coverage
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest tests/ --cov=app --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: sonarcloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:${{ env.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:buildcache,mode=max

  security-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL
          trivyignores: .trivyignore

  image-signing:
    name: Image Signing
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sign backend image
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-backend:latest

      - name: Sign frontend image
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/noteops-frontend:latest

  api-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose up -d
          sleep 15

      - name: Wait for backend health
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:5000/api/health && break
            echo "Waiting for backend... attempt $i"
            sleep 5
          done

      - name: Run API tests
        run: |
          curl -sf http://localhost:5000/api/health | grep '"ok"'

          NOTE_ID=$(curl -sf -X POST http://localhost:5000/api/notes \
            -H "Content-Type: application/json" \
            -d '{"title":"CI test note","content":"created by pipeline"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Created note ID: $NOTE_ID"

          curl -sf http://localhost:5000/api/notes | python3 -c \
            "import sys,json; notes=json.load(sys.stdin); assert len(notes)>=1"

          curl -sf -X DELETE http://localhost:5000/api/notes/$NOTE_ID
          echo "API integration tests passed"

      - name: Tear down stack
        if: always()
        run: docker compose down
